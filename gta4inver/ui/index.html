<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="hidden">

    <!-- ===== header ===== -->
    <div id="header">
        <div class="h-left">
            <div class="h-title">INVENTORY</div>
            <div class="h-sub"><span id="h-name">-</span> &nbsp;|&nbsp; <span id="h-number"></span></div>
        </div>
        <div class="h-mid">
            <div class="bar-wrap">
                <div class="bar-label">SLOTS <span id="cap-slots-txt">0/20</span></div>
                <div class="bar"><div id="cap-slots" class="bar-fill"></div></div>
            </div>
            <div class="bar-wrap">
                <div class="bar-label">WEIGHT <span id="cap-weight-txt">0.0/50.0 kg</span></div>
                <div class="bar"><div id="cap-weight" class="bar-fill"></div></div>
            </div>
        </div>
        <div class="h-right">
            <div id="h-cash" class="cash">$0</div>
            <button id="btn-phone" class="btn-mini" title="Open Phone (P)">&#9742; PHONE</button>
            <button id="btn-close" class="btn-mini danger">&#10005; CLOSE</button>
        </div>
    </div>

    <!-- ===== body ===== -->
    <div id="body">

        <!-- left: grid -->
        <div id="grid-area">
            <div id="grid"></div>
        </div>

        <!-- right: details -->
        <div id="side">
            <div id="detail">
                <div id="d-icon" class="d-icon empty">
                    <svg viewBox="0 0 48 48"><path fill="currentColor" d="M24 6 6 22h4v18h28V22h4L24 6zm6 22h-4v-4h-4v4h-4v4h4v4h4v-4h4v-4z"/></svg>
                </div>
                <div id="d-name" class="d-name">Select an item</div>
                <div id="d-kind" class="d-kind">-</div>
                <div id="d-info" class="d-info">Click an item in the grid to manage it.<br>Drag &amp; drop to rearrange, merge or store.</div>

                <div id="d-actions">
                    <button id="a-use" class="btn">USE</button>
                    <button id="a-drop" class="btn">DROP</button>
                    <button id="a-give" class="btn">GIVE</button>
                    <button id="a-split" class="btn">SPLIT</button>
                </div>

                <div id="quick-row">
                    <div class="q-label">QUICKSLOTS (F2-F6) - drag an item here or use SET</div>
                    <div id="quick-slots"></div>
                </div>
            </div>

            <!-- storage panel -->
            <div id="storage" class="hidden">
                <div id="st-title" class="st-title">STORAGE</div>
                <div class="bar-wrap">
                    <div class="bar-label">STORAGE WEIGHT <span id="st-weight-txt"></span></div>
                    <div class="bar"><div id="st-weight" class="bar-fill gold"></div></div>
                </div>
                <div id="st-list" class="st-list"></div>
            </div>
        </div>
    </div>

    <!-- ===== split modal ===== -->
    <div id="modal" class="hidden">
        <div class="modal-box">
            <div class="modal-title">SPLIT STACK</div>
            <div class="modal-sub" id="modal-sub">-</div>
            <input id="modal-amount" type="number" min="1" value="1">
            <div class="modal-btns">
                <button id="modal-ok" class="btn">SPLIT</button>
                <button id="modal-cancel" class="btn danger">CANCEL</button>
            </div>
        </div>
    </div>

    <!-- toasts -->
    <div id="toasts"></div>
</div>

<script src="app.js"></script>
</body>
</html>
